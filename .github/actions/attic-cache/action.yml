name: configure Attic cache
description: Install the CI runtime, trust the public cache, and optionally connect for uploads
inputs:
  connect-tailnet:
    description: Connect an ephemeral GitHub-hosted runner for uploads
    default: "false"
  tailscale-client-id:
    description: Tailscale federated identity client ID
    default: ""
  tailscale-audience:
    description: Tailscale federated identity audience
    default: ""
runs:
  using: composite
  steps:
    - name: configure cache downloads
      shell: bash
      run: |
        {
          echo 'NIX_CONFIG<<ATTIC_NIX_CONFIG'
          printf '%s\n' "${NIX_CONFIG:-}"
          echo 'extra-substituters = https://cache.quasar.sucha.foo/main'
          echo 'extra-trusted-public-keys = cache.quasar.sucha.foo-1:avw2bKdcZFvA4wivKF3HipWPSO6R3iW79oykb/xKn5w='
          echo 'ATTIC_NIX_CONFIG'
        } >> "$GITHUB_ENV"
    - name: install CI runtime
      shell: bash
      run: |
        # retain GC roots for every runtime package until the job finishes
        paths="$(nix build --inputs-from . \
          .#attic-client-ci nixpkgs#bash nixpkgs#coreutils \
          nixpkgs#util-linux nixpkgs#jq nixpkgs#python3 nixpkgs#curl \
          --no-write-lock-file --out-link "$RUNNER_TEMP/ci-runtime" --print-out-paths)"
        while IFS= read -r path; do
          echo "$path/bin" >> "$GITHUB_PATH"
        done <<< "$paths"
    # never replace the self-hosted runner's existing Tailscale connection
    - name: connect ephemeral cache uploader
      if: inputs.connect-tailnet == 'true' && runner.environment == 'github-hosted'
      uses: tailscale/github-action@v4
      with:
        oauth-client-id: ${{ inputs.tailscale-client-id }}
        audience: ${{ inputs.tailscale-audience }}
        tags: tag:ci-cache
