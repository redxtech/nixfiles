name: configure Attic cache
description: Install the pinned Attic client and trust Quasar's public cache
runs:
  using: composite
  steps:
    - name: configure cache downloads
      shell: bash
      run: |
        {
          echo 'NIX_CONFIG<<ATTIC_NIX_CONFIG'
          printf '%s\n' "${NIX_CONFIG:-}"
          echo 'extra-substituters = https://cache.quasar.sucha.foo/main'
          echo 'extra-trusted-public-keys = cache.quasar.sucha.foo-1:avw2bKdcZFvA4wivKF3HipWPSO6R3iW79oykb/xKn5w='
          echo 'ATTIC_NIX_CONFIG'
        } >> "$GITHUB_ENV"
    - name: install Attic client
      shell: bash
      run: |
        client="$(nix build --inputs-from . nixpkgs#attic-client \
          --no-write-lock-file --out-link "$RUNNER_TEMP/attic-client" --print-out-paths)"
        echo "$client/bin" >> "$GITHUB_PATH"
