name: update flake inputs

on:
  workflow_dispatch:
    inputs:
      force-build:
        description: Build and cache targets even when there is no update PR
        type: boolean
        default: false

concurrency:
  group: update-flake-inputs
  cancel-in-progress: false

permissions:
  contents: read

env:
  NIX_CONFIG: |
    accept-flake-config = true
    max-jobs = 1
    cores = 2
    keep-outputs = false
    min-free = 4294967296
    max-free = 12884901888
    auto-optimise-store = true

defaults:
  run:
    shell: bash

# monitoring: remove marked blocks, wrapper lines, and step IDs to disable reports
# monitoring: helper files are .github/scripts/resource_usage.py and .github/scripts/test_resource_usage.py
jobs:
  update:
    if: github.ref_type == 'branch' && github.ref_name != 'automation/update-flake-inputs'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    outputs:
      build-ref: ${{ steps.pr.outputs.pull-request-number && steps.pr.outputs.pull-request-head-sha || github.sha }}
      has-pr: ${{ steps.pr.outputs.pull-request-number != '' }}
      should-build: ${{ steps.pr.outputs.pull-request-number != '' || inputs.force-build }}
    steps:
      - uses: wimpysworld/nothing-but-nix@v12
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: ${{ env.NIX_CONFIG }}
      - name: update all flake inputs
        run: nix flake update
      - name: create or update pull request
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ github.ref_name }}
          branch: automation/update-flake-inputs
          delete-branch: true
          add-paths: flake.lock
          commit-message: "chore: update flake inputs"
          title: "chore: update flake inputs"
          body: |
            update all inputs in `flake.lock`.

            this workflow builds `bastion`, `voyager`, `quasar`,
            the default `x86_64-linux` devShell, and select packages.
            package closures, locally built system outputs, and the devShell
            closure are uploaded to `gabedunn` Cachix.
            attic also receives locally built outputs and the complete package,
            system, and devShell closures.

            the pull request is created before the builds, so its existence
            does not indicate that validation passed.
            the `update-flake / validation` commit status reports the build
            and cache upload results for this pull request's exact head commit.

            [view build results](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

  status:
    name: set pending validation status
    needs: update
    if: needs.update.outputs.has-pr == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/github-script@v8
        env:
          STATUS_PHASE: pending
          NEEDS_JSON: ${{ toJSON(needs) }}
        with:
          script: |
            const report = require('./.github/scripts/update-flake-status.cjs');
            await report({ github, context, core });

  report:
    name: report validation results
    needs: [update, status, packages, systems, devshell]
    if: ${{ always() && needs.update.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/github-script@v8
        env:
          STATUS_PHASE: complete
          NEEDS_JSON: ${{ toJSON(needs) }}
        with:
          script: |
            const report = require('./.github/scripts/update-flake-status.cjs');
            await report({ github, context, core });

  packages:
    name: build and cache ${{ matrix.package }}
    needs: update
    if: needs.update.outputs.should-build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        package:
          - betterbird
          - input-custom
          - secretspec
          - voxtype-full
    steps:
      - uses: wimpysworld/nothing-but-nix@v12
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.update.outputs.build-ref }}
          persist-credentials: false
      - name: configure Nix builder
        uses: ./.github/actions/nix-builder
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cachix-signing-key: ${{ secrets.CACHIX_SIGNING_KEY }}
      - name: build package
        id: build # monitoring: used only by the report steps
        env:
          PACKAGE: ${{ matrix.package }}
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          bash .github/scripts/attic-ci.sh --result ./result-package \
            python3 .github/scripts/resource_usage.py record --output-dir "$RUNNER_TEMP/resource-usage" -- \
              bash .github/scripts/build-target.sh ".#packages.x86_64-linux.${PACKAGE}" ./result-package
      - name: push package closure
        run: bash .github/scripts/time-command.sh "cachix upload" cachix push --jobs 2 --num-concurrent-chunks 1 gabedunn ./result-package
      # monitoring: begin
      - name: summarize build resource usage
        if: ${{ always() && steps.build.outcome != 'skipped' }}
        continue-on-error: true
        run: python3 .github/scripts/resource_usage.py report --output-dir "$RUNNER_TEMP/resource-usage"
      - name: upload build resource usage
        if: ${{ always() && steps.build.outcome != 'skipped' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: resource-usage-package-${{ matrix.package }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/resource-usage/
          retention-days: 30
          if-no-files-found: warn
      # monitoring: end

  systems:
    name: build ${{ matrix.host }}
    needs: [update, packages]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      # reuse uploads between hosts instead of compiling shared packages concurrently
      max-parallel: 1
      matrix:
        host:
          - bastion
          - voyager
          - quasar
    steps:
      - uses: wimpysworld/nothing-but-nix@v12
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.update.outputs.build-ref }}
          persist-credentials: false
      - name: configure Nix builder
        uses: ./.github/actions/nix-builder
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cachix-signing-key: ${{ secrets.CACHIX_SIGNING_KEY }}
          # keep explicit full-system uploads opt-in for the small cache
          cachix-push-filter: "-nixos-system-"
      - name: build system
        id: build # monitoring: used only by the report steps
        env:
          HOST: ${{ matrix.host }}
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          bash .github/scripts/attic-ci.sh --result ./result-system \
            python3 .github/scripts/resource_usage.py record --output-dir "$RUNNER_TEMP/resource-usage" -- \
              bash .github/scripts/build-target.sh ".#nixosConfigurations.${HOST}.config.system.build.toplevel" ./result-system

      # package uploads still include their dependencies, so the cache can fill
      # - name: push final system closure
      #   run: cachix push --jobs 2 --num-concurrent-chunks 1 gabedunn ./result-system
      # monitoring: begin
      - name: summarize build resource usage
        if: ${{ always() && steps.build.outcome != 'skipped' }}
        continue-on-error: true
        run: python3 .github/scripts/resource_usage.py report --output-dir "$RUNNER_TEMP/resource-usage"
      - name: upload build resource usage
        if: ${{ always() && steps.build.outcome != 'skipped' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: resource-usage-system-${{ matrix.host }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/resource-usage/
          retention-days: 30
          if-no-files-found: warn
      # monitoring: end

  devshell:
    name: build and cache default devShell
    needs: [update, packages]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: wimpysworld/nothing-but-nix@v12
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.update.outputs.build-ref }}
          persist-credentials: false
      - name: configure Nix builder
        uses: ./.github/actions/nix-builder
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cachix-signing-key: ${{ secrets.CACHIX_SIGNING_KEY }}
      - name: build default devShell
        id: build # monitoring: used only by the report steps
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          bash .github/scripts/attic-ci.sh --result ./result-devshell \
            python3 .github/scripts/resource_usage.py record --output-dir "$RUNNER_TEMP/resource-usage" -- \
              bash .github/scripts/build-target.sh .#devShells.x86_64-linux.default ./result-devshell
      - name: push devShell closure
        run: bash .github/scripts/time-command.sh "cachix upload" cachix push --jobs 2 --num-concurrent-chunks 1 gabedunn ./result-devshell
      # monitoring: begin
      - name: summarize build resource usage
        if: ${{ always() && steps.build.outcome != 'skipped' }}
        continue-on-error: true
        run: python3 .github/scripts/resource_usage.py report --output-dir "$RUNNER_TEMP/resource-usage"
      - name: upload build resource usage
        if: ${{ always() && steps.build.outcome != 'skipped' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: resource-usage-devshell-${{ github.run_attempt }}
          path: ${{ runner.temp }}/resource-usage/
          retention-days: 30
          if-no-files-found: warn
      # monitoring: end
