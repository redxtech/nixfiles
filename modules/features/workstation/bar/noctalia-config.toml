[backdrop]
enabled = true

[bar]
order = [ "Primary" ]

    [bar.Primary]
    center = [ "workspaces" ]
    end = [
        "privacy",
        "cpu",
        "sysmon_cpu_temp",
        "sysmon_gpu",
        "ram",
        "bar_2",
        "tray",
        "status_2",
        "status",
        "notifications",
        "recorder",
        "network",
        "volume",
        "brightness",
        "battery",
        "clock",
        "session"
    ]
    margin_edge = 0
    margin_ends = 0
    radius = 0
    radius_bottom_left = 12
    radius_bottom_right = 12
    start = [ "launcher", "wallpaper", "active_window", "media", "weather" ]

[calendar]
enabled = true

[control_center]
sidebar = "full"

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "dark_mode"

    [[control_center.shortcuts]]
    type = "nightlight"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "power_profile"

[desktop_widgets]
enabled = false

[dock]
background_opacity = 1.0
launcher_position = "start"

[hot_corners.top_left]
action = "command"

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]
pre_action_fade_seconds = 5

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 300.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 600.0

[location]
auto_locate = true

[lockscreen]
allow_empty_password = true
blur_intensity = 0.99999997764825821
tint_intensity = 0.24999999441206455

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box@DP-2",
    "lockscreen-login-box@DP-1",
    "lockscreen-widget-0000000000000001",
    "lockscreen-widget-0000000000000004"
]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 201.0
    box_width = 912.0
    cx = 1280.0
    cy = 1320.0
    output = "DP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_session_buttons = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 201.0
    box_width = 720.0
    cx = 1280.0
    cy = 1321.0
    output = "DP-2"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_session_buttons = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 128.0
    box_width = 240.0
    cx = 1280.0
    cy = 208.0
    output = "DP-1"
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        center_text = true
        clock_style = "digital"
        format = "{:%H:%M:%S}"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
    box_height = 176.0
    box_width = 896.0
    cx = 1280.0
    cy = 1112.0
    output = "DP-1"
    rotation = 0.0
    type = "fancy_audio_visualizer"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000002.settings]
        background = true
        fade_when_idle = true
        visualization_mode = "bars_rings"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000004]
    box_height = 176.0
    box_width = 896.0
    cx = 1280.0
    cy = 1112.0
    output = "DP-1"
    rotation = 0.0
    type = "fancy_audio_visualizer"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000004.settings]
        background = true
        fade_when_idle = false
        visualization_mode = "bars_rings"

[notification]
background_opacity = 1.0

[osd]
background_opacity = 1.0
orientation = "vertical"
position_vertical = "top_right"

[plugin_settings."icefish/phone-connect"]
battery_display = "percent"

[plugin_settings."noctalia/screen_recorder"]
audio_source = "both"
filename_pattern = "recording_%Y%m%d_%H%M%S"

[plugins]
enabled = [
    "pozzoo/hassio",
    "noctalia/screen_recorder",
    "noctalia/bitwarden",
    "icefish/phone-connect",
    "cleboost/ssh-launcher",
    "gabedunn/voxtype"
]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

[shell]
avatar_path = "/home/gabe/.face"
clipboard_image_action_command = "satty -f {path}"
date_format = "%A, %B %e, %Y"
font_family = "Noto Sans"
launch_apps_as_systemd_services = true
niri_overview_type_to_launch_enabled = true
password_style = "random"
polkit_agent = true
screen_time_enabled = true
settings_show_advanced = true
telemetry_enabled = true
time_format = "{:%H:%M:%S}"

    [shell.animation]
    speed = 2.0000000298023224

    [shell.panel]
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"

    [shell.screenshot]
    directory = "/home/gabe/Pictures/Screenshots"

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "command"
    command = "systemctl reboot --boot-loader-entry=auto-windows"
    countdown_seconds = 0.0
    enabled = true
    glyph = "brand-windows"
    label = "Windows"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[theme]
builtin = "Dracula"
custom_palette = "stylix"
mode = "dark"
source = "custom"

[wallpaper]
directory = "/home/gabe/Pictures/Wallpaper"
transition_on_startup = true

    [wallpaper.automation]
    enabled = true
    interval_seconds = 3600

    [wallpaper.default]
    path = "/home/gabe/Pictures/Wallpaper/all_I_need_4k.png"

    [wallpaper.last]
    path = "/home/gabe/Pictures/Wallpaper/all_I_need_4k.png"

    [wallpaper.monitors.DP-1]
    path = "/home/gabe/Pictures/Wallpaper/all_I_need_4k.png"

    [wallpaper.monitors.DP-2]
    path = "/home/gabe/Pictures/Wallpaper/all_I_need_4k.png"

[widget.active_window]
capsule = true
max_length = 300
title_scroll = "on_hover"

[widget.bar]
capsule = true
enabled = false
type = "icefish/phone-connect:bar"

[widget.bar_2]
capsule = true
type = "icefish/phone-connect:bar"

[widget.battery]
capsule = true

[widget.bluetooth]
capsule = true

[widget.brightness]
capsule = true
show_label = false

[widget.clock]
capsule = true
capsule_padding = 9
format = "{:%a, %H:%M}"
tooltip_format = "{:%A, %B %d - %H:%M:%S}"
vertical_format = "{:%H %M}"

[widget.cpu]
show_value = false

[widget.launcher]
glyph = "rocket"

[widget.media]
anchor = true
capsule = true
hide_when_no_media = true
title_scroll = "on_hover"

[widget.network]
capsule = true
show_label = false

[widget.notifications]
capsule = true

[widget.privacy]
capsule = true
hide_inactive = true

[widget.ram]
show_value = true

[widget.recorder]
capsule = true
type = "noctalia/screen_recorder:recorder"

[widget.session]
capsule = true
capsule_foreground = "error"

[widget.status]
capsule = true
type = "pozzoo/hassio:status"

[widget.status_2]
capsule = true
type = "gabedunn/voxtype:status"

[widget.sysmon]
show_value = false
stat = "cpu_temp"

[widget.sysmon_cpu]
show_value = false
type = "sysmon"

[widget.sysmon_cpu_temp]
show_value = false
stat = "cpu_temp"
type = "sysmon"

[widget.sysmon_gpu]
show_value = false
stat = "gpu_usage"
type = "sysmon"

[widget.tray]
capsule = true
drawer = true
drawer_columns = 5
pinned = [ "Super Productivity_status_icon_1", "indicator_solaar" ]

[widget.volume]
capsule = true

[widget.workspaces]
capsule = true
hide_when_empty = true
